[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyclustx"
version = "1.4.3"
description = "A Unified Framework for Multi-View and Multimodal Representation Learning and Clustering from Feature Views to Attributed Graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Abdelheq Mokhtari", email = "abdelheq.mokhtari@u-pariscite.fr" },
    { name = "Lazhar Labiod", email = "lazhar.labiod@u-pariscite.fr" },
    { name = "Mohamed Nadif", email = "mohamed.nadif@u-pariscite.fr" },
]

keywords = [
    "graph",
    "clustering",
    "representation learning",
    "multi-view",
    "machine learning"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "requests>=2.25.0",
    "torch>=2.4,<3",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "streamlit>=1.51,<2",
    "pandas>=1.5",
    "plotly>=5.10",
    "networkx>=2.8",
    "optuna>=4,<6",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "build>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
ui = ["streamlit>=1.51,<2", "pandas>=1.5", "plotly>=5.10", "networkx>=2.8"]
display = ["streamlit>=1.51,<2", "pandas>=1.5", "plotly>=5.10", "networkx>=2.8"]

[project.urls]
Homepage = "https://github.com/AbdelheqMokhtari/PolyClustX"
Documentation = "https://polyclustx.readthedocs.io/en/latest/"
BugTracker = "https://github.com/AbdelheqMokhtari/PolyClustX/issues"

[project.scripts]
polyclustx = "polyclustx.command:main"
polyclustx-display = "polyclustx.display:launch"
lmgec = "polyclustx.models.lmgec:main"
scm = "polyclustx.models.scm:main"
idec = "polyclustx.models.idec:main"
completer = "polyclustx.models.completer:main"
dcp = "polyclustx.models.dcp:main"
mflvc = "polyclustx.models.mflvc:main"
conan = "polyclustx.models.conan:main"
dgf = "polyclustx.models.dgf:main"
g-comvkm = "polyclustx.models.g_comvkm:main"
sgla = "polyclustx.models.sgla:main"
umc = "polyclustx.models.umc:main"
multiview-kmeans = "polyclustx.models.multiview_kmeans:main"
multiview-spectral = "polyclustx.models.multiview_spectral:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyclustx = ["configs/*.yaml"]
"polyclustx.display" = ["assets/*.png"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "1.4.3"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/polyclustx/__init__.py:__version__",
]

update_changelog_on_bump = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dataset-loader tests can download more than 1 GB from Hugging Face, so they are
# deselected by default.  Run them with:  pytest -m network
addopts = "-q -m 'not network'"
markers = [
    "network: downloads a dataset from Hugging Face (deselected by default)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort — the checks CI enforces.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["polyclustx"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymv-clustering"
version = "1.2.0"
description = "Python package for multi-view graph clustering and representation learning algorithms."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Abdelheq Mokhtari", email = "mokhtari.abdelheq@gmail.com" }
]

keywords = [
    "graph",
    "clustering",
    "representation learning",
    "multi-view",
    "machine learning"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "requests>=2.25.0",
    "tensorflow>=2.10.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "build>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
display = ["streamlit>=1.40,<2", "pandas>=1.5", "plotly>=5.10"]

[project.urls]
Homepage = "https://github.com/AbdelheqMokhtari/pymv"
BugTracker = "https://github.com/AbdelheqMokhtari/pymv/issues"

[project.scripts]
pymv-cli = "pymv_cli_entry:main"
pymv-display = "pymv.display:launch"

[tool.setuptools]
package-dir = {"" = "src"}
# Top-level module holding the console-script entry point.  It must be
# listed explicitly — packages.find only discovers packages, not
# single-file modules, so without this `pymv-cli` breaks on install.
py-modules = ["pymv_cli_entry"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymv = ["configs/*.yaml", "assets/*.png", "assets/*.css"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "1.2.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/pymv/__init__.py:__version__",
]

update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dataset-loader tests can download more than 1 GB from Zenodo, so they are
# deselected by default.  Run them with:  pytest -m network
addopts = "-q -m 'not network'"
markers = [
    "network: downloads a dataset from Zenodo (deselected by default)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort — the checks CI enforces.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pymv"]

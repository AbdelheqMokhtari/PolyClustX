[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymv"
version = "0.3.3"
description = "Python package for multi-view graph clustering and representation learning algorithms."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

authors = [
    { name = "Abdelheq Mokhtari", email = "mokhtari.abdelheq@gmail.com" }
]

keywords = [
    "graph",
    "clustering",
    "representation learning",
    "multi-view",
    "machine learning"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "tensorflow>=2.10.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mokhtari.abdelheq/graph-lmgec"
BugTracker = "https://github.com/mokhtari.abdelheq/graph-lmgec/issues"

[project.scripts]
pymv-cli = "pymv_cli_entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.3"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/pymv/__init__.py:__version__",
]

update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

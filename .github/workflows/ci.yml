name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners have no GPU; keep TensorFlow quiet and on CPU.
  TF_CPP_MIN_LOG_LEVEL: "3"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported versions.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        # Dataset-download tests are deselected by default (see pyproject);
        # a small live check is available in the manual dataset workflow.
        run: pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Check the wheel ships the CLI entry point and configs
        run: |
          python -m zipfile -l dist/*.whl > wheel.txt
          grep -q "pymv_cli_entry.py" wheel.txt
          grep -q "pymv/configs/default.yaml" wheel.txt

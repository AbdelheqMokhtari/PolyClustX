name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners have no GPU; keep TensorFlow quiet and on CPU.
  TF_CPP_MIN_LOG_LEVEL: "3"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Core compatibility floor and recommended user environment.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        # Dataset-download tests are deselected by default (see pyproject);
        # a small live check is available in the manual dataset workflow.
        run: pytest -m 'not network' --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and sdist
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Check installed distribution and packaged resources
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import distribution
          package = distribution("pymv-clustering")
          files = {str(path) for path in package.files}
          for path in ("pymv_cli_entry.py", "pymv/configs/default.yaml", "pymv/display/assets/logo.png"):
              assert path in files, path
          scripts = {entry.name for entry in package.entry_points}
          assert {"pymv-cli", "pymv-display"} <= scripts
          assert {"ui", "display"} <= set(package.metadata.get_all("Provides-Extra"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep installs small; limit worker threads on shared runners.
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  # NEW: Fail-fast linting job. Catches syntax/style errors in seconds.
  lint:
    name: Lint codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    name: Test · Python ${{ matrix.python-version }}
    needs: lint # Waits for the lint job to pass first
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Core compatibility floor and recommended user environment.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Test
        # Dataset-download tests are deselected by default (see pyproject);
        # a small live check is available in the manual dataset workflow.
        run: pytest -m 'not network' --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  build:
    name: Build distribution
    needs: test # Only build if tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and sdist
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Check installed distribution and packaged resources
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import distribution
          # Ensure "polyclustx" exactly matches the package name in pyproject.toml
          package = distribution("polyclustx")
          files = {str(path) for path in package.files}
          for path in ("polyclustx/cli.py", "polyclustx/__main__.py", "polyclustx/brand.py",
                       "polyclustx/configs/default.yaml", "polyclustx/display/assets/logo.png",
                       "polyclustx/display/assets/borelli.png", "polyclustx/display/assets/paris_cite.png"):
              assert path in files, path
          assert not any(path.startswith("pymv/") for path in files)
          requirements = package.requires or []
          assert any(req.startswith("torch") for req in requirements)
          assert not any("tensorflow" in req.lower() for req in requirements)
          assert any(path.endswith("/licenses/THIRD_PARTY_NOTICES.md") for path in files)
          assert not any(path.startswith(("SCM/", "IDEC/", "Completer/", "DCP/", "MFLVC/",
                                          "conan/", "DGF/", "G-CoMVKM/", "SGLA/", "UMC/", "GMVC/")) for path in files)
          scripts = {entry.name for entry in package.entry_points}
          assert {"polyclustx", "polyclustx-cli", "polyclustx-display"} <= scripts
          assert not any(name.startswith("pymv") for name in scripts)
          for dependency in ("streamlit", "pandas", "plotly", "networkx", "optuna"):
              assert any(req.startswith(dependency) and "extra ==" not in req for req in requirements)
          assert {"ui", "display"} <= set(package.metadata.get_all("Provides-Extra"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

name: Dataset smoke test

# Live loader tests depend on Zenodo and some datasets are larger than 1 GB.
# Keep them out of required CI and provide a manual smoke test for the small
# ACM dataset. The complete catalog can still be checked locally with
# `pytest -m network`.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  loaders:
    name: ACM loader
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Load and validate ACM from Zenodo
        run: pytest tests/test_dataloader.py -m network -rs

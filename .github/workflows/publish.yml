name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release tag to publish (for example, v1.4.1)"
        required: true
        default: v1.4.1
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release and build distributions
    if: >-
      github.repository == 'AbdelheqMokhtari/PolyClustX' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Validate requested tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.4.1."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check release version and history
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          expected = os.environ["RELEASE_TAG"][1:]
          config = tomllib.loads(Path("pyproject.toml").read_text())
          assert config["project"]["name"] == "polyclustx"
          assert config["project"]["version"] == expected, "Tag and package version differ"
          source = ast.parse(Path("src/polyclustx/__init__.py").read_text())
          version = next(ast.literal_eval(node.value) for node in source.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == "__version__"
                                 for target in node.targets))
          assert version == expected, "Tag and import version differ"
          PY

      - name: Build and validate upload files
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test the installed wheel
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "dist/polyclustx-${RELEASE_TAG#v}-py3-none-any.whl[dev]"
          python -m pip check
          ruff check src/ tests/
          pytest -m 'not network'

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish validated distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/polyclustx/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Upload to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
